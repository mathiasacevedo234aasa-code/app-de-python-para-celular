name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Instalar Buildozer
        run: pip install --upgrade buildozer "cython<3.0" setuptools wheel

      - name: Caché de Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Incluir librerías de Python puro
        run: pip install --no-compile --target vendor pygments requests

      - name: Compilar APK (debug)
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: PyStudio-apk
          path: bin/*.apk

      - name: Publicar APK como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest bin/*.apk --title "PyStudio APK" --notes "Compilación automática de ${GITHUB_SHA::7}"

      - name: Publicar registro si falla
        if: failure()
        run: |
          mkdir /tmp/log && tail -n 400 build.log > /tmp/log/build-tail.log || echo "sin build.log" > /tmp/log/build-tail.log
          cd /tmp/log && git init -q -b build-log
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add . && git commit -q -m "registro de compilacion"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log
